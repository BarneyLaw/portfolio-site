server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Default for everything: revalidate before reuse, so a deploy appears
    # immediately. Only /_astro/ opts out below.
    #
    # This used to be a `location ~* \.html$` block, which matches on the URI
    # rather than the file served — so it never fired for a clean URL like /
    # or /blog, and those responses carried no cache headers at all. An nginx
    # `add_header` in a nested location replaces the inherited set rather than
    # merging, so the /_astro/ override below is complete.
    add_header Cache-Control "no-cache" always;

    # Astro generates real HTML files and directories.
    location / {
        try_files $uri $uri.html $uri/index.html $uri/ =404;
    }

    # Fingerprinted build assets: the name changes when the bytes do, so these
    # can be cached forever. A single header, not `expires` plus `add_header`,
    # which would emit two conflicting Cache-Control values.
    location /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        application/rss+xml
        text/xml
        image/svg+xml;
}