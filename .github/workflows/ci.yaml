name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

# A newer push to the same PR makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Check, build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24 # matches node:24-alpine in the Dockerfile
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build
        env:
          PUBLIC_API_BASE_URL: /api

      - name: Smoke-test the built site
        run: npm test

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  container:
    name: Container build and smoke test
    # The deploy image is built and pushed by container.yaml on master; here we
    # prove the Dockerfile and nginx config still assemble *and serve*.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Plain `docker build`, not buildx. This job only needs the image in the
      # local daemon so the next step can run it, and dockerd has BuildKit
      # built in — whereas setup-buildx-action's docker-container driver must
      # first pull moby/buildkit from Docker Hub, which is a network round trip
      # that can (and did) time out before any of our code is even read.
      # The trade-off is no cross-run layer cache on this job; the deploy build
      # in container.yaml still uses buildx and keeps its cache.
      - name: Build image
        run: |
          docker build \
            --build-arg PUBLIC_API_BASE_URL=/api \
            -t packetcraft-site:ci \
            .

      - name: Start the container
        run: |
          docker run -d --name site -p 8080:8080 packetcraft-site:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
              echo "container is serving"; exit 0
            fi
            sleep 1
          done
          echo "container did not become ready"; docker logs site; exit 1

      # These probe the real nginx config — try_files, MIME types and cache
      # headers — which the Node-based test/served-site.test.mjs only imitates.
      - name: Smoke-test the served site
        run: |
          set -euo pipefail
          base=http://127.0.0.1:8080
          fail() { echo "FAIL: $*"; docker logs site; exit 1; }

          status() { curl -s -o /dev/null -w '%{http_code}' "$1"; }
          header() { curl -s -o /dev/null -D - "$1" | tr -d '\r' | grep -i "^$2:" | cut -d' ' -f2-; }

          echo "== health =="
          [ "$(status $base/healthz)" = 200 ] || fail "/healthz"

          echo "== clean URLs (nginx try_files) =="
          for path in / /about /blog /projects /reviews \
                      /blog/building-a-homelab /blog/building-a-homelab/ \
                      /projects/k3s-cluster /reviews/warframe; do
            code=$(status "$base$path")
            [ "$code" = 200 ] || fail "$path returned $code"
          done

          echo "== missing routes are 404 =="
          for path in /nope /blog/does-not-exist; do
            code=$(status "$base$path")
            [ "$code" = 404 ] || fail "$path returned $code, expected 404"
          done

          echo "== discovery endpoints =="
          for path in /rss.xml /sitemap-index.xml; do
            [ "$(status $base$path)" = 200 ] || fail "$path"
            header "$base$path" content-type | grep -qi xml || fail "$path content-type"
          done

          echo "== asset MIME types and cache policy =="
          css=$(curl -s $base/ | grep -o '/_astro/[^"]*\.css' | head -1)
          [ -n "$css" ] || fail "no stylesheet linked from /"
          header "$base$css" content-type | grep -qi 'text/css' || fail "css content-type"
          header "$base$css" cache-control | grep -qi immutable || fail "css should be immutable"

          # Un-fingerprinted, so it must stay revalidatable.
          header "$base/og-default.png" content-type | grep -qi 'image/png' || fail "og card type"
          if header "$base/og-default.png" cache-control | grep -qi immutable; then
            fail "og-default.png must not be immutable"
          fi

          # HTML must revalidate or a deploy never appears.
          header "$base/" cache-control | grep -qi 'no-cache' || fail "html should be no-cache"

          echo "all container smoke checks passed"

      - name: Stop the container
        if: always()
        run: docker rm -f site || true
