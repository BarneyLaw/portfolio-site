name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

# Only the newest run for a branch remains relevant. For master, this also
# prevents two frontend releases from promoting concurrently.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Check, build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build
        env:
          PUBLIC_API_BASE_URL: /api
          # Stamped into dist/content-registry.json.
          GITHUB_SHA: ${{ github.sha }}

      - name: Test built site and content registry
        run: npm test

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
          if-no-files-found: error

      # The GitOps deployment job consumes this artifact. It is a complete
      # snapshot, so tests must pass before it can be promoted.
      - name: Upload content registry
        uses: actions/upload-artifact@v4
        with:
          name: content-registry
          path: dist/content-registry.json
          retention-days: 30
          if-no-files-found: error

  container:
    name: Container build and smoke test
    needs:
      - build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The PR job keeps the image in the local Docker daemon so the actual
      # nginx configuration can be exercised without publishing anything.
      - name: Build image
        run: |
          docker build \
            --build-arg PUBLIC_API_BASE_URL=/api \
            --build-arg CONTENT_REVISION=${{ github.sha }} \
            -t packetcraft-site:ci \
            .

      - name: Start container
        run: |
          docker run -d --name site -p 8080:8080 packetcraft-site:ci

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
              echo "container is serving"
              exit 0
            fi

            sleep 1
          done

          echo "container did not become ready"
          docker logs site
          exit 1

      - name: Smoke-test served site
        run: |
          set -euo pipefail

          base=http://127.0.0.1:8080

          fail() {
            echo "FAIL: $*"
            docker logs site
            exit 1
          }

          status() {
            curl -s -o /dev/null -w '%{http_code}' "$1"
          }

          header() {
            curl -s -o /dev/null -D - "$1" |
              tr -d '\r' |
              grep -i "^$2:" |
              cut -d' ' -f2-
          }

          echo "== health =="

          [ "$(status "$base/healthz")" = 200 ] ||
            fail "/healthz"

          echo "== clean URLs =="

          for path in \
            / \
            /about \
            /blog \
            /projects \
            /reviews \
            /blog/building-a-homelab \
            /blog/building-a-homelab/ \
            /projects/k3s-cluster \
            /reviews/warframe
          do
            code=$(status "$base$path")

            [ "$code" = 200 ] ||
              fail "$path returned $code"
          done

          echo "== missing routes =="

          for path in /nope /blog/does-not-exist
          do
            code=$(status "$base$path")

            [ "$code" = 404 ] ||
              fail "$path returned $code, expected 404"
          done

          echo "== discovery endpoints =="

          for path in /rss.xml /sitemap-index.xml
          do
            [ "$(status "$base$path")" = 200 ] ||
              fail "$path"

            header "$base$path" content-type |
              grep -qi xml ||
              fail "$path content-type"
          done

          echo "== assets and cache policy =="

          css=$(
            curl -s "$base/" |
              grep -o '/_astro/[^"]*\.css' |
              head -1
          )

          [ -n "$css" ] ||
            fail "no stylesheet linked from /"

          header "$base$css" content-type |
            grep -qi 'text/css' ||
            fail "css content-type"

          header "$base$css" cache-control |
            grep -qi immutable ||
            fail "css should be immutable"

          header "$base/og-default.png" content-type |
            grep -qi 'image/png' ||
            fail "og card type"

          if header "$base/og-default.png" cache-control |
            grep -qi immutable
          then
            fail "og-default.png must not be immutable"
          fi

          header "$base/" cache-control |
            grep -qi 'no-cache' ||
            fail "html should be no-cache"

          echo "all container smoke checks passed"

      - name: Stop container
        if: always()
        run: docker rm -f site || true

  deploy:
    name: Publish image and promote deployment
    needs:
      - build

    # Pull requests only validate. Master pushes and deliberate manual runs
    # from master publish and promote.
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch')

    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      packages: write

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4

      # This is the registry produced and tested by the build job above.
      - name: Download content registry
        uses: actions/download-artifact@v5
        with:
          name: content-registry
          path: registry

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/portfolio-site
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            PUBLIC_API_BASE_URL=/api
            CONTENT_REVISION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Compute image tag
        id: sha
        shell: bash
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Check out GitOps repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/homelab-cicd-config
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          path: config

      # Pinned release tarball rather than the upstream install script.
      #
      # That script is fetched from `master` — a moving target — and resolves
      # "latest" through the unauthenticated GitHub API at run time. Shared
      # runner IPs get rate-limited, the lookup returns an empty string, and it
      # fails with `Version  does not exist or is not available for
      # linux/amd64`, which is a confusing way to be told "you were throttled".
      #
      # A pinned URL has no lookup step and gives the same binary every run.
      # Bump KUSTOMIZE_VERSION deliberately; the checksum must be updated with
      # it, and `sha256sum -c` will fail loudly if the two disagree.
      - name: Install Kustomize
        shell: bash
        env:
          KUSTOMIZE_VERSION: v5.7.1
          KUSTOMIZE_SHA256: ea375e7372f9aa029129d4b2d16c66b7750b7f1213c4f66f910d981c895818d8
        run: |
          set -euo pipefail

          url="https://github.com/kubernetes-sigs/kustomize/releases/download"
          url="${url}/kustomize%2F${KUSTOMIZE_VERSION}"
          url="${url}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"

          # --retry rides out a transient blip rather than failing the deploy
          # after the image has already been pushed.
          curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors -o kustomize.tar.gz "$url"

          echo "${KUSTOMIZE_SHA256}  kustomize.tar.gz" | sha256sum -c -

          tar -xzf kustomize.tar.gz kustomize
          sudo install -m 0755 kustomize /usr/local/bin/kustomize
          rm -f kustomize kustomize.tar.gz

          kustomize version

      - name: Copy content registry into GitOps
        shell: bash
        run: |
          cp \
            registry/content-registry.json \
            config/apps/portfolio/frontend/content-registry.json

      - name: Update frontend image
        working-directory: config/apps/portfolio/frontend
        shell: bash
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner}/portfolio-site"

          kustomize edit set image \
            "${image}=${image}:${{ steps.sha.outputs.sha }}"

      - name: Validate frontend deployment
        working-directory: config/apps/portfolio/frontend
        shell: bash
        run: kustomize build . >/dev/null

      - name: Commit and push deployment
        working-directory: config
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            apps/portfolio/frontend/kustomization.yaml \
            apps/portfolio/frontend/content-registry.json

          if git diff --cached --quiet; then
            echo "GitOps is already up to date"
            exit 0
          fi

          git commit -m "deploy: portfolio ${{ steps.sha.outputs.sha }}"

          # Backend releases may also update this repository.
          git pull --rebase origin main
          git push origin HEAD:main